[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoatlas-showcase"
version = "0.1.0"
description = "Selected plane-sampling and sequence-decoding research components"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
